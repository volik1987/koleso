<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a120b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Колесо! AR</title>
<style>
  :root { --wood:#c98a4b; --dark:#1a120b; --red:#e2412f; --cream:#fbefd9; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--dark); color:var(--cream);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
  #stage canvas { position:fixed; inset:0; display:block; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #ui > * { pointer-events:auto; }
  .hud { position:absolute; top:calc(env(safe-area-inset-top) + 10px); left:12px; right:12px; display:none;
    justify-content:space-between; align-items:center; font-weight:800; font-size:20px; text-shadow:0 2px 4px #000a; pointer-events:none !important; }
  .hud .lives { letter-spacing:2px; }
  .hud .lvl { font-size:14px; opacity:.85; font-weight:700; }
  .hint { position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%);
    background:#000a; padding:10px 16px; border-radius:14px; font-size:16px; text-align:center; max-width:86vw; display:none; pointer-events:none !important; }
  .panel { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    padding:24px 20px; text-align:center; background:radial-gradient(circle at 50% 35%, #3a2513 0%, #1a120b 70%); }
  .panel.glass { background:#0009; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  h1 { font-size:46px; margin:0; letter-spacing:1px; color:var(--wood); text-shadow:0 3px 0 #000; }
  h2 { font-size:30px; margin:0; }
  p { margin:0; max-width:420px; line-height:1.4; opacity:.9; }
  .small { font-size:13px; opacity:.65; }
  button { font:inherit; font-weight:800; font-size:19px; border:0; border-radius:16px; padding:15px 26px; min-width:240px;
    background:var(--wood); color:#2a1606; box-shadow:0 4px 0 #6e4520; cursor:pointer; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #6e4520; }
  button.alt { background:#4a3a2c; color:var(--cream); box-shadow:0 4px 0 #2a2017; }
  button[hidden] { display:none; }
  .wheel-ico { font-size:70px; animation: spin 2.2s linear infinite; display:inline-block; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #flash { position:absolute; inset:0; background:var(--red); opacity:0; pointer-events:none !important; transition:opacity .35s; }
  #exit { position:absolute; top:calc(env(safe-area-inset-top) + 48px); right:12px; min-width:0; padding:8px 12px; font-size:14px; display:none; }
  #height { position:absolute; top:calc(env(safe-area-inset-top) + 48px); left:12px; min-width:0; padding:8px 12px; font-size:14px; display:none; }
  #pop { position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); font-size:34px; font-weight:900; color:#ffd36b;
    text-shadow:0 3px 0 #000; opacity:0; transition:opacity .3s, transform .3s; pointer-events:none !important; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<div id="stage"></div>
<div id="ui">
  <div id="flash"></div>
  <div class="hud" id="hud"><span class="lives" id="lives">❤️❤️❤️</span><span class="lvl" id="lvl">Уровень 1</span><span id="score">0</span></div>
  <div id="pop"></div>
  <div class="hint" id="hint"></div>
  <button class="alt" id="exit">✕ Выход</button>
  <button class="alt" id="height">📱 1.4 м</button>

  <div class="panel" id="start">
    <div class="wheel-ico">🛞</div>
    <h1>Колесо!</h1>
    <p>По полу на тебя катятся тяжёлые колёса. Тыкай в них пальцем — каждое касание выбивает куски. Разломай колесо, пока оно тебя не задавило!</p>
    <button id="btnXR" hidden>▶ Играть в AR</button>
    <button id="btnCam">▶ Играть с камерой</button>
    <p class="small" id="modeNote">Проверяю поддержку AR…</p>
    <p class="small" id="loadNote">Загружаю колесо…</p>
  </div>

  <div class="panel glass" id="over" style="display:none">
    <h2>💥 Задавило!</h2>
    <p id="overText"></p>
    <button id="again">Ещё раз</button>
    <button class="alt" id="toMenu">В меню</button>
  </div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
